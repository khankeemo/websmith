[package]
name = "${package_name}"
version = "${kit_version}"
edition = "2021"
description = "${product_name} SDK — License management client with HMAC-SHA256 signing, hardware fingerprinting, offline cache, and trial/license lifecycle support"
license = "MIT"
authors = ["Websmith License API Center"]

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
os_info = "3.7"
machine-uid = "0.3"
dirs = "5.0"
mac_address = "1.1"

[lib]
name = "${lib_name}"
path = "src/lib.rs"
